site_name: Python Senior — База знаний
site_description: Структурированная база знаний для собеседований Python Senior
docs_dir: docs

theme:
  name: material
  language: ru
  palette:
    - scheme: default
      primary: blue
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Тёмная тема
    - scheme: slate
      primary: blue
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Светлая тема
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
    - toc.integrate

plugins:
  - search:
      lang: ru

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - toc:
      permalink: true

nav:
  - Главная: index.md
  - Python Core: python-core.md
  - ООП: oop.md
  - Параллелизм и асинхронность: concurrency.md
  - Базы данных: databases.md
  - Web и API: web-api.md
  - Кэширование: caching.md
  - Очереди и фоновые задачи: queues.md
  - Архитектура: architecture.md
  - Тестирование: testing.md
  - Безопасность: security.md
  - DevOps: devops.md
  - Git: git.md
  - Python vs C++: performance.md
