site_name: Python Senior — Knowledge Base
site_description: Structured knowledge base for Python Senior interviews
docs_dir: docs

theme:
  name: material
  language: en
  palette:
    - scheme: default
      primary: blue
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Dark theme
    - scheme: slate
      primary: blue
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Light theme
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
    - toc.integrate

plugins:
  - search:
      lang: en

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Python Core: python-core.md
  - OOP: oop.md
  - Concurrency & Async: concurrency.md
  - Threading vs asyncio vs Multiprocessing: threading.md
  - Databases: databases.md
  - Web & API: web-api.md
  - Caching: caching.md
  - Queues & Tasks: queues.md
  - Architecture: architecture.md
  - Django Internals: django.md
  - Testing: testing.md
  - Security: security.md
  - System Programming: system.md
  - DevOps: devops.md
  - Git: git.md
  - Performance: performance.md
  - ML & Data (NumPy, Pandas): ml-data.md
