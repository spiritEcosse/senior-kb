site_name: Python Senior — Knowledge Base
site_description: Structured knowledge base for Python Senior interviews
docs_dir: docs

theme:
  name: material
  language: en
  palette:
    - scheme: default
      primary: blue
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Dark theme
    - scheme: slate
      primary: blue
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Light theme
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
    - toc.integrate

plugins:
  - search:
      lang:
        - en
        - ru

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - toc:
      permalink: true

nav:
  - Home: index.md
  - "🇬🇧 English":
    - Overview: en/index.md
    - Python Core: en/python-core.md
    - OOP: en/oop.md
    - Concurrency & Async: en/concurrency.md
    - Databases: en/databases.md
    - Web & API: en/web-api.md
    - Caching: en/caching.md
    - Queues & Tasks: en/queues.md
    - Architecture: en/architecture.md
    - Testing: en/testing.md
    - Security: en/security.md
    - DevOps: en/devops.md
    - Git: en/git.md
    - Performance: en/performance.md
  - "🇷🇺 Русский":
    - Обзор: index.md
    - Python Core: python-core.md
    - ООП: oop.md
    - Параллелизм и async: concurrency.md
    - Базы данных: databases.md
    - Web и API: web-api.md
    - Кэширование: caching.md
    - Очереди и задачи: queues.md
    - Архитектура: architecture.md
    - Тестирование: testing.md
    - Безопасность: security.md
    - DevOps: devops.md
    - Git: git.md
    - Производительность: performance.md
